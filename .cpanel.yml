---
# cPanel Git Version Control deploy pipeline.
#
# Triggered when you click "Deploy HEAD Commit" (or push, if auto-deploy is
# enabled) on this repo in cPanel. The Git repository for this app is
# configured with its Repository Path set to the neca-app Node.js App's
# own Application root (/home/necasmwo/neca-app), so these tasks already
# run with that directory as the working directory — there is no separate
# checkout to copy the build output *from*, it's built right where it
# needs to live.
#
# NODEVENV_ACTIVATE below is the Node.js Selector's "Enter to the virtual
# environment" command for the neca-app Node.js App.
#
# RAYON_NUM_THREADS=1 caps the thread pool Next.js's native Rust tooling
# (SWC, lightningcss) spins up during the build. This shared host can't
# fork enough threads for the default pool size and fails partway through
# compiling with "Resource temporarily unavailable". See next.config.ts's
# experimental.cpus for the equivalent cap on the Node-side worker pool.
#
# Same requirement as deploy.sh: a real .env.local must already exist at
# the app root before `npm run build` runs here, or NEXT_PUBLIC_* vars
# compile in as undefined (cPanel's env var UI doesn't reach this deploy
# task's shell) — see README's "Deployment" section for the full story.
deployment:
  tasks:
    - export NODEVENV_ACTIVATE=/home/necasmwo/nodevenv/neca-app/24/bin/activate
    - source $NODEVENV_ACTIVATE
    - npm ci
    - RAYON_NUM_THREADS=1 npm run build
    # output: "standalone" (next.config.ts) produces a self-contained
    # server at .next/standalone/server.js, but per Next's own docs it
    # does NOT include public/ or .next/static — those have to be copied
    # in by hand. cPanel's "Application startup file" points directly at
    # .next/standalone/server.js (see deploy/ssh/README.md's neighbour,
    # the top-level README, for the full note on this).
    - /bin/mkdir -p .next/standalone/.next
    - /bin/cp -R .next/static .next/standalone/.next/static
    - /bin/cp -R public .next/standalone/public
    - /bin/mkdir -p tmp
    - /bin/touch tmp/restart.txt
