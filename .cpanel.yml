---
# cPanel Git Version Control deploy pipeline.
#
# Triggered when you click "Deploy HEAD Commit" (or push, if auto-deploy is
# enabled) on this repo in cPanel. The Git repository for this app is
# configured with its Repository Path set to the neca-app Node.js App's
# own Application root (/home/necasmwo/neca-app), so these tasks already
# run with that directory as the working directory — there is no separate
# checkout to copy the build output *from*, it's built right where it
# needs to live.
#
# NODEVENV_ACTIVATE below is the Node.js Selector's "Enter to the virtual
# environment" command for the neca-app Node.js App.
#
# RAYON_NUM_THREADS=1 caps the thread pool Next.js's native Rust tooling
# (SWC, lightningcss) spins up during the build. This shared host can't
# fork enough threads for the default pool size and fails partway through
# compiling with "Resource temporarily unavailable". See next.config.ts's
# experimental.cpus for the equivalent cap on the Node-side worker pool.
#
# NODE_OPTIONS="--max-old-space-size=512" caps the JS heap Node's own
# `next build` process is allowed to grow. This does NOT cap the process's
# total memory — native/off-heap allocations (buffers, the Rust tooling
# above, mmap'd files) sit outside it entirely, and this host's real
# ceiling is enforced separately at the OS level. What it DOES do,
# empirically: a lower ceiling makes V8 collect garbage more eagerly
# instead of growing the heap opportunistically, which measurably lowers
# actual peak RSS during the build, not just the JS heap figure. Measured
# repeatedly on an equivalent build: default heap sizing peaks in the
# ~1000-1050MB range; capped at 512MB it consistently peaks ~900-950MB.
# 384MB still completes but with much thinner margin; 256MB reliably
# crashes with a real "JavaScript heap out of memory" error — 512MB is
# the tested floor with real safety margin, not just the first value that
# happened to work once.
#
# Same requirement as deploy.sh: a real .env.local must already exist at
# the app root before `npm run build` runs here, or NEXT_PUBLIC_* vars
# compile in as undefined (cPanel's env var UI doesn't reach this deploy
# task's shell) — see README's "Deployment" section for the full story.
#
# WARNING — unlike deploy.sh (the actually-active path, see README), this
# builds straight into the live .next, not an isolated .next-build with
# an atomic swap at the end. next build's cleanDistDir default (true)
# wipes .next the moment the build *starts*, deleting the running
# .next/standalone/server.js long before a replacement exists — any
# crash or OOM partway through (this host is memory-constrained enough
# for that to be a real risk) leaves the live site broken until the next
# successful build. If this path is ever revived instead of deploy.sh,
# port deploy.sh's NEXT_DIST_DIR + smoke-test + rename-swap approach over
# first.
deployment:
  tasks:
    - export NODEVENV_ACTIVATE=/home/necasmwo/nodevenv/neca-app/24/bin/activate
    - source $NODEVENV_ACTIVATE
    - npm ci
    - RAYON_NUM_THREADS=1 NODE_OPTIONS="--max-old-space-size=512" npm run build
    # Next's own generated .next/standalone/server.js (freshly regenerated
    # by every `next build`, so this has to be patched post-build, not
    # edited once) contains `const hostname = process.env.HOSTNAME ||
    # '0.0.0.0'` — see node_modules/next/dist/build/utils.js's SERVER_FILE
    # template. Many shared hosts (this one included) export an ambient
    # HOSTNAME shell var (e.g. the box's own name, "server224.web-hosting.com")
    # that's inherited by whatever spawns the Node app (Passenger, in
    # cPanel's case) — Next then binds *only* to that resolved address
    # instead of all interfaces. Passenger/LiteSpeed proxy to the app over
    # localhost/a private socket, so an app that isn't listening on
    # 0.0.0.0 is unreachable from them even though it runs fine and
    # returns real 200s when hit directly by the exact hostname — the
    # confusing "works, but only from one exact address" symptom this
    # fixes. Force it unconditionally so no ambient env var can narrow the
    # bind again.
    - /bin/sed -i "s/const hostname = process.env.HOSTNAME || '0.0.0.0'/const hostname = '0.0.0.0'/" .next/standalone/server.js
    - /bin/mkdir -p .next/standalone/.next
    - /bin/cp -R .next/static .next/standalone/.next/static
    - /bin/cp -R public .next/standalone/public
    - /bin/mkdir -p tmp
    - /bin/touch tmp/restart.txt
