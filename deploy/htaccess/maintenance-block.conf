# Maintenance mode + preview bypass — mod_rewrite block for .htaccess
# ======================================================================
#
# This is NOT applied automatically. cPanel's "Setup Node.js App" feature
# owns the live .htaccess at the app root (same directory as this repo's
# checkout on the server, /home/necasmwo/neca-app) and rewrites its own
# Passenger directives (PassengerAppRoot, PassengerBaseURI, etc.)
# whenever that app's settings change in the cPanel UI — so this block
# is committed here as a reference, not deployed by git pull or
# deploy.sh. Paste it in ONCE, by hand, over SSH:
#
#   1. nano /home/necasmwo/neca-app/.htaccess
#   2. Paste this whole block in at the very TOP of the file — it must
#      come BEFORE cPanel's Passenger directives. mod_rewrite runs
#      during Apache/LiteSpeed's URL-translation phase, which happens
#      before Passenger's own request handling, so an [L]-flagged rule
#      up here can serve a static file or force a status code without
#      Passenger/Node ever being invoked — this is Phusion Passenger's
#      own documented technique for exactly this "maintenance page while
#      the app is down" case, not a hack specific to this app.
#   3. Replace REPLACE_WITH_SECRET (both occurrences below) with a real
#      secret — a generated example (already replaced with a fresh
#      value in the pasted-in copy on the server, never committed here):
#        python3 -c "import secrets; print(secrets.token_urlsafe(24))"
#   4. Save, then confirm cPanel didn't already overwrite your paste —
#      re-check this file after any future change to the Node App's
#      settings in "Setup Node.js App", since that UI regenerates
#      .htaccess and *should* only touch its own managed block, but
#      verify rather than assume.
#
# On/off, from the app root (/home/necasmwo/neca-app):
#   ON:  touch MAINTENANCE_MODE
#   OFF: rm MAINTENANCE_MODE
# No Apache/Passenger restart needed either way — mod_rewrite checks
# for the file fresh on every request.
#
# Preview bypass, once maintenance is ON:
#   https://apply.necaexcellenceawards.com/?preview=REPLACE_WITH_SECRET
# Visiting that once sets a cookie (~5.6 days, Apache's CO= default in
# this build — see below) so normal browsing/clicking through the app
# afterward doesn't need the query param on every request. Wrong or
# missing secret always falls through to the maintenance page.
#
# Real-Apache-verified (mod_rewrite, not this app's actual LiteSpeed
# host — see caveat in README) against all of: normal traffic passing
# through untouched while MAINTENANCE_MODE is absent; every path
# blocked with a real 503 once it's present; correct secret reaching
# the app and setting a cookie; the cookie alone (no query param)
# continuing to bypass on later requests/paths; a wrong secret or wrong
# cookie still blocked; maintenance.html itself always loading directly
# with no redirect loop through its own ErrorDocument; and traffic
# resuming immediately once the flag file is removed.
#
# Two real bugs surfaced and got fixed by that testing, not just
# theorized about:
#   - Without an early exemption for maintenance.html itself, serving it
#     via ErrorDocument re-entered these same rules (it also matches the
#     MAINTENANCE_MODE condition) and produced a second, nested 503
#     instead of the page — fixed by the `^maintenance\.html$` rule
#     below, which must stay first.
#   - Apache's CO= flag docs describe an optional NAME:VAL:DOMAIN:
#     lifetime:path:secure:httponly form, but on the Apache/2.4.58
#     build tested here, supplying an explicit lifetime put that value
#     into the cookie's `path` attribute instead and left the expiry an
#     apparently-fixed ~5.6-day default no matter what lifetime was
#     given — so this uses the minimal, unambiguous NAME:VAL:DOMAIN form
#     rather than fight an undocumented-here field-order quirk. ~5.6
#     days is a perfectly fine default for an admin convenience cookie;
#     re-visiting the ?preview= link resets it if it ever expires
#     mid-use.
# ======================================================================

RewriteEngine On

# The maintenance page itself must always be servable directly — without
# this, ErrorDocument's internal subrequest for it re-enters the block
# below and produces a nested error instead of the page.
RewriteRule ^maintenance\.html$ - [L]

# Preview bypass: a valid ?preview=SECRET sets a cookie and lets this
# request straight through to the app (the L flag means it never
# reaches the maintenance check below on this same request).
RewriteCond %{QUERY_STRING} (^|&)preview=REPLACE_WITH_SECRET(&|$)
RewriteRule ^ - [CO=neca_preview:REPLACE_WITH_SECRET:%{HTTP_HOST},L]

# Maintenance mode: if the flag file exists and there's no valid preview
# cookie, force a 503 and let ErrorDocument serve the static page below
# — this never reaches Passenger/Node.
RewriteCond %{DOCUMENT_ROOT}/MAINTENANCE_MODE -f
RewriteCond %{HTTP_COOKIE} !neca_preview=REPLACE_WITH_SECRET
RewriteRule ^ - [R=503,L]

ErrorDocument 503 /maintenance.html

# ==== End maintenance mode block. cPanel-managed Passenger directives
# ==== continue below this point — do not edit those.
